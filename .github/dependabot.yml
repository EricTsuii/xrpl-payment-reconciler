version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Major versions change the pinned stack and need a new specification.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # fastify must stay on the version @nestjs/platform-fastify depends on.
      - dependency-name: fastify
    groups:
      nestjs:
        patterns: ['@nestjs/*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Major versions change the pinned stack and need a new specification.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Major versions change the pinned stack and need a new specification.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
