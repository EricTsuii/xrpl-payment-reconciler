name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 12.4.1

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: false

      - name: Install pnpm
        run: npm install --global "pnpm@${PNPM_VERSION}"

      - name: Verify pnpm version
        run: test "$(pnpm --version)" = "${PNPM_VERSION}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

  integration:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://reconciler:reconciler_local_only@localhost:5432/reconciler
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: false

      - name: Install pnpm
        run: |
          npm install --global "pnpm@${PNPM_VERSION}"
          test "$(pnpm --version)" = "${PNPM_VERSION}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start PostgreSQL and Redis
        run: docker compose up -d postgres redis

      - name: Wait for health
        run: bash scripts/wait-for-services.sh 60

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Integration tests
        run: pnpm test:integration

      - name: E2E tests
        run: pnpm test:e2e

      - name: Build image
        run: docker build -t xrpl-payment-reconciler:ci .

      - name: Diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs postgres
          docker compose logs redis
          node --version
          pnpm --version

      - name: Clean up
        if: always()
        run: docker compose down -v
